# Reference translation for forkers. NOT loaded by the code — only src/i18n/locale.yaml is used.
locale_code: en-US
date_style: long

meta:
  site_title: "Nameslav - The Name Roulette"
  site_description: "A joke name roulette: find out which Svyatoslav you are today. No sign-up, no data collection."
  og_description: "Today you are — {{name}}"

home:
  eyebrow: "Today you are —"
  start_hint: "press \"Start\" to reveal today's name"
  share_button: "Share"
  reroll_hint: "Result resets at midnight (GMT)"

share_page:
  heading: "{{date}}: {{name}}"
  fallback_heading: "This Svyatoslav is lost in time..."
  fallback_og_description: "This link got lost in time — roll your own on the homepage"
  home_link: "Home"

errors:
  not_found_title: "Page not found"
  not_found_text: "Nothing here — the link looks like a typo."
  server_error_title: "Something broke"
  server_error_text: "The service could not handle the request. Please try again in a moment."
