<!doctype html>
<!--
  The homepage template. Placeholders spelled {{...}} in upper snake case are
  filled once at startup by src/routes/home.ts via src/utils/template.ts; the raw
  file is never served (GET / renders it, GET /index.html redirects to /).
  Note the renderer is strict both ways — an unfilled placeholder and an unused
  value are both errors — so prose here must not spell a real placeholder name.

  public/share.html is its sibling for /r/:token — same card structure, but
  server-rendered instead of filled in by script.js. Structural or CSS class
  changes here almost always need the same edit there.
-->
<html lang="{{LOCALE_CODE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SITE_TITLE}}</title>
<meta property="og:title" content="{{SITE_TITLE}}">
<meta property="og:description" content="{{SITE_DESCRIPTION}}">
<meta property="og:image" content="{{OG_IMAGE_URL}}">
<meta property="og:url" content="{{SITE_URL}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/assets/style.css">
</head>
<!-- data-load-error is rendered server-side on purpose: if the failure is that
     /api/locale.json never arrived, script.js has no locale left to read. -->
<body data-load-error="{{LOAD_ERROR}}">
<main class="card" id="card">
  <div class="bg-idle" aria-hidden="true"></div>
  <div class="bg-theme" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>
  <div class="panel">
    <div class="panel-main">
      <!-- Status text is deliberately untranslated (terminal/CLI aesthetic). -->
      <p class="status" id="status">nameslav.sh · waiting</p>
      <!-- The reel is pure motion: announcing every name that flies past would
           make the page unusable with a screen reader, so it is hidden from the
           accessibility tree and #result-announcement speaks the outcome once. -->
      <div class="reel-window" id="reel-window" aria-hidden="true">
        <button class="start-btn" id="start-button" type="button">{{START_BUTTON}}<span class="arrow">→</span></button>
        <div class="reel-track" id="reel-track"></div>
      </div>
      <p class="sr-only" id="result-announcement" role="status" aria-live="polite"></p>
      <p class="hint" id="hint">{{START_HINT}}</p>
      <div class="meta-mobile" id="meta-mobile">
        <div class="meta-mobile-col">
          <span class="meta-category" id="meta-category-m"></span>
          <span class="meta-id" id="meta-id-m"></span>
        </div>
        <div class="meta-mobile-col meta-mobile-col--right">
          <span class="meta-date" id="meta-date-m"><span class="cursor" id="meta-cursor-m"></span></span>
          <span class="meta-caption" id="meta-caption-m"></span>
        </div>
      </div>
      <button class="share-btn" id="share-button" type="button" disabled>{{SHARE_BUTTON}}</button>
      <div class="footer-row">
        <p class="footnote" id="footnote"></p>
        <a class="repo-link" href="https://github.com/SvyatBeloz/Nameslav" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
    <div class="rail" id="rail">
      <div class="rail-content">
        <span class="meta-id" id="meta-id-d"></span>
        <p class="meta-category-vertical" id="meta-category-d"></p>
        <div class="rail-date-block">
          <span class="meta-date" id="meta-date-d"><span class="cursor" id="meta-cursor-d"></span></span>
          <span class="meta-caption" id="meta-caption-d"></span>
        </div>
      </div>
    </div>
  </div>
</main>
<script type="module" src="/assets/script.js"></script>
</body>
</html>
