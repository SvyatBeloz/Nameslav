services:
  svyatbeloz:
    build: .
    container_name: svyatbeloz-roulette
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - SITE_DOMAIN=svyatbeloz.link
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./cache:/app/cache
    networks:
      - dmz-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/readyz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  dmz-network:
    external: true
